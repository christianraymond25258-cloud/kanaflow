<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>{% block title %}KanaFlow{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --black: #0a0a0f;
      --black2: #0f0f1a;
      --card: #13131f;
      --card2: #1a1a2e;
      --blue: #38bdf8;
      --blue2: #0ea5e9;
      --blue3: #7dd3fc;
      --blue-dim: rgba(56,189,248,0.10);
      --blue-glow: rgba(56,189,248,0.22);
      --text: #f0f4f8;
      --muted: #94a3b8;
      --border: rgba(56,189,248,0.15);
      --danger: #f87171;
      --success: #34d399;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--black);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      max-width: 100vw;
    }
    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    {% block extra_style %}{% endblock %}
  </style>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/mobile.css' %}">
</head>
<body>
<canvas id="bg-canvas"></canvas>
{% block content %}{% endblock %}

<script>
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  const kana = ['あ','い','う','え','お','か','き','く','さ','し','す',
                 'ア','イ','ウ','エ','オ','カ','キ','ク','サ','シ','ス',
                 '漢','字','語','日','本','山','川','火','水','木','天'];
  let particles = [];
  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  function init() {
    particles = [];
    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        char: kana[Math.floor(Math.random() * kana.length)],
        size: Math.random() * 20 + 10,
        speed: Math.random() * 0.35 + 0.08,
        opacity: Math.random() * 0.10 + 0.02,
        drift: (Math.random() - 0.5) * 0.25,
      });
    }
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      ctx.font = `${p.size}px 'Noto Sans JP', sans-serif`;
      ctx.fillStyle = `rgba(56,189,248,${p.opacity})`;
      ctx.fillText(p.char, p.x, p.y);
      p.y -= p.speed; p.x += p.drift;
      if (p.y < -40) { p.y = canvas.height + 40; p.x = Math.random() * canvas.width; p.char = kana[Math.floor(Math.random() * kana.length)]; }
      if (p.x < -40) p.x = canvas.width + 40;
      if (p.x > canvas.width + 40) p.x = -40;
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', () => { resize(); init(); });
  resize(); init(); draw();

  // Hamburger menu toggle
  function toggleMenu() {
    const links = document.querySelector('.nav-links');
    if (links) links.classList.toggle('open');
  }
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
